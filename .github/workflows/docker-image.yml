name: wayshub-backend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  init:

    runs-on: ubuntu-22.04 
    environment: development

    steps:
    - name: checkout scm
      uses: actions/checkout@v4
    
    - name: Build the Docker image
      run: docker build -t alvindra/wayshub:${{ vars.TAG }} .

    - name: Docker Login
      uses: docker/login-action@v4
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Docker Push
      run: docker push alvindra/wayshub:${{ vars.TAG }}
          
  deploy:
    runs-on: ubuntu-22.04
    environment: development
    needs: build

    steps:
    - name: Execute SSH for deployment
      uses: appleboy/ssh-action@v1.2.5
      with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd wayshub-be/
            docker compose pull
            docker compose down
            docker compose up -d
