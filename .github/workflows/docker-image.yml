name: wayshub-backend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-22.04 
    environment: development

    steps:
    - name: checkout scm
      uses: actions/checkout@v4
    
    - name: Build the Docker image
      run: docker build -t alvindra/wayshub:${{ vars.TAG }} .

    - name: Docker Login
      uses: docker/login-action@v4
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Docker Push
      run: docker push alvindra/wayshub:${{ vars.TAG }}
          
  test:
    runs-on: ubuntu-22.04
    environment: development

    steps:
    - name: test
      run: echo "testing"
